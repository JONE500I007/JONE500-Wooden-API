plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

base {
	archivesName = project.archives_base_name
}

repositories {
	// Loom adds the repositories needed for Minecraft, Fabric Loader and Fabric API automatically.
}

// ---------------------------------------------------------------------------
// "testmod" source set: an example mod that USES Wooden API.
// It is only for testing in the dev environment and is NOT included in the
// published jar. Its code lives in src/testmod/.
// ---------------------------------------------------------------------------
sourceSets {
	testmod {
		compileClasspath += main.compileClasspath + main.output
		runtimeClasspath += main.runtimeClasspath + main.output
		resources.srcDir 'src/testmod/generated'
	}
}

loom {
	mods {
		"jone500_wooden_api" {
			sourceSet sourceSets.main
		}
		"wooden_test" {
			sourceSet sourceSets.testmod
		}
	}

	runs {
		// Minecraft with Wooden API + the example wood from the testmod.
		testmodClient {
			client()
			configName = "Testmod Client"
			source sourceSets.testmod
			runDir "run"
		}
		testmodServer {
			server()
			configName = "Testmod Server"
			source sourceSets.testmod
			runDir "run/server"
		}
		// Automated test on a real dedicated server (no client code): places blocks, spawns boats.
		gameTest {
			server()
			configName = "Server Game Test"
			vmArg "-Dfabric-api.gametest"
			vmArg "-Dfabric-api.gametest.report-file=${file("build/run/gameTest/junit.xml")}"
			source sourceSets.testmod
			runDir "build/run/gameTest"
		}
		// Automated in-game test: opens a world, places all blocks, takes screenshots, then quits.
		clientGameTest {
			client()
			configName = "Client Game Test"
			vmArg "-Dfabric.client.gametest"
			source sourceSets.testmod
			runDir "build/run/clientGameTest"
		}
		// Runs data generation for the testmod (shows how a user of the API does datagen).
		datagen {
			client()
			configName = "Data Generation (testmod)"
			vmArg "-Dfabric-api.datagen"
			vmArg "-Dfabric-api.datagen.output-dir=${file("src/testmod/generated")}"
			vmArg "-Dfabric-api.datagen.modid=wooden_test"
			source sourceSets.testmod
			runDir "build/datagen"
		}
	}
}

// The client game test also starts a dedicated server, which only runs if the Minecraft EULA
// (https://aka.ms/MinecraftEULA) is accepted. The project owner has accepted it, so eula.txt is
// written into the test folder (only there) before every run.
def clientGameTestEula = file("build/run/clientGameTest/eula.txt")
tasks.named("runClientGameTest") {
	doFirst {
		clientGameTestEula.parentFile.mkdirs()
		clientGameTestEula.text = "eula=true\n"
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API is required by Wooden API.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

processTestmodResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	// Publishes a -sources.jar next to the main jar so modders can read the API code in their IDE.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// ---------------------------------------------------------------------------
// Maven publishing: lets other modders write
//   modImplementation "net.wooden.api:jone500-wooden-api:1.0.0"
// Run `gradlew publishToMavenLocal` to test it on your own computer.
// ---------------------------------------------------------------------------
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	repositories {
		// Add a remote maven here when you have one, for example your own Reposilite server:
		// maven {
		//     name = "WoodenMaven"
		//     url = "https://maven.example.com/releases"
		//     credentials(PasswordCredentials)   // reads WoodenMavenUsername / WoodenMavenPassword from ~/.gradle/gradle.properties
		// }
	}
}
