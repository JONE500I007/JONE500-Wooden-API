plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

// Version = mod version + Minecraft version, e.g. 1.0.0+1.21.10, so the builds for different
// Minecraft versions never share a version number (on Modrinth or in the jar name).
version = "${project.mod_version}+${project.minecraft_version}"

base {
	archivesName = project.archives_base_name
}

repositories {
	// Loom adds the repositories needed for Minecraft, Fabric Loader and Fabric API automatically.
}

// ---------------------------------------------------------------------------
// "tutorial" source set: a tutorial mod that shows how to USE Wooden API
// (start with src/tutorial/java/net/wooden/tutorial/TutorialMod.java).
// It is only for the dev environment and is NOT included in the published jar.
// ---------------------------------------------------------------------------
sourceSets {
	tutorial {
		compileClasspath += main.compileClasspath + main.output
		runtimeClasspath += main.runtimeClasspath + main.output
		resources.srcDir 'src/tutorial/generated'
	}
}

loom {
	mods {
		"jone500_wooden_api" {
			sourceSet sourceSets.main
		}
		"wooden_tutorial" {
			sourceSet sourceSets.tutorial
		}
	}

	runs {
		// Minecraft with Wooden API + the tutorial woods.
		tutorialClient {
			client()
			configName = "Tutorial Client"
			source sourceSets.tutorial
			runDir "run"
		}
		tutorialServer {
			server()
			configName = "Tutorial Server"
			source sourceSets.tutorial
			runDir "run/server"
		}
		// Runs data generation for the tutorial (shows how a user of the API does datagen).
		datagen {
			client()
			configName = "Data Generation (tutorial)"
			vmArg "-Dfabric-api.datagen"
			vmArg "-Dfabric-api.datagen.output-dir=${file("src/tutorial/generated")}"
			vmArg "-Dfabric-api.datagen.modid=wooden_tutorial"
			source sourceSets.tutorial
			runDir "build/datagen"
		}
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API is required by Wooden API.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

processTutorialResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	// Publishes a -sources.jar next to the main jar so modders can read the API code in their IDE.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// ---------------------------------------------------------------------------
// Maven publishing: lets other modders write
//   modImplementation "net.wooden.api:jone500-wooden-api:1.0.0+1.21.10"
// Run `gradlew publishToMavenLocal` to test it on your own computer.
// ---------------------------------------------------------------------------
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	repositories {
		// Add a remote maven here when you have one, for example your own Reposilite server:
		// maven {
		//     name = "WoodenMaven"
		//     url = "https://maven.example.com/releases"
		//     credentials(PasswordCredentials)   // reads WoodenMavenUsername / WoodenMavenPassword from ~/.gradle/gradle.properties
		// }
	}
}
